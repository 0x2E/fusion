name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel mid-run: a killed `gh release create`/upload leaves partial assets
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up toolchains
        uses: ./.github/actions/setup-toolchains
        with:
          setup-node: "true"
      - name: Test
        run: ./scripts.sh test
      - name: Build release artifacts
        run: ./scripts.sh release
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" || gh release create "$tag" --draft --generate-notes
          gh release upload "$tag" ./dist/*.zip ./dist/fusion-linux-* ./dist/checksums.txt --clobber
